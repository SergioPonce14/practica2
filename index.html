<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Liga</title>
    <link rel="stylesheet" href="/src/style.css">
    <script type="module" src="/src/main.ts"></script>
</head>
<body>
    <header>
        <h1>La Liga</h1>
        <p>Los 20 clubes de Primera División: haz clic en cualquier equipo para ver su historia y estadio</p>
    </header>

    <main class="contenedor-principal">
        <section id="controles" class="panel-controles">
            <input type="text" id="inputBuscar" placeholder="Buscar por equipo, ciudad o estadio...">

            <select id="selectOrden">
                <option value="nombre">Ordenar por nombre (A-Z)</option>
                <option value="capacidad">Mayor capacidad de estadio</option>
                <option value="fundacion">Más antiguos primero</option>
            </select>

            <button id="btnRecargar" type="button">recargar</button>
        </section>

        <!-- Estadísticas calculadas con reduce() -->
        <section id="estadisticas" class="panel-estadisticas"></section>

        <!-- Contenedor para los 3 estados (cargando, error, vacío) y las 20 tarjetas -->
        <section id="contenedorEquipos" class="grid-equipos"></section>
    </main>

    
    <div id="modalDetalle" class="modal oculto">
        <div class="modal-contenido">
            <button id="btnCerrarModal" class="btn-cerrar" type="button">✖ Cerrar</button>
            <div id="cuerpoModal"></div>
        </div>
    </div>
</body>
</html>
