<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Liga · M2 Async Odyssey</title>
    <link rel="stylesheet" href="/src/style.css">
    <script type="module" src="/src/main.ts" defer></script>
</head>
<body>
    <header>
        <h1>⚽ Atlas de La Liga</h1>
        <p>Explora los clubes de Primera División, marca tus favoritos y consulta su historia</p>
    </header>

    <main class="contenedor-principal">
        <section id="controles" class="panel-controles">
            <input type="text" id="inputBuscar" placeholder="Buscar por equipo, ciudad o estadio...">

            <select id="selectOrden">
                <option value="nombre">Ordenar por nombre (A-Z)</option>
                <option value="fundacion">Más antiguos primero</option>
            </select>

            <label class="filtro-favoritos">
                <input type="checkbox" id="checkFavoritos">
                <span>⭐ Solo favoritos</span>
            </label>

            <button id="btnRecargar" type="button">🔄 Limpiar caché y recargar</button>
        </section>

        <!-- Estadísticas calculadas con reduce() y Object.groupBy() -->
        <section id="estadisticas" class="panel-estadisticas"></section>

        <!-- Contenedor para los 3 estados (cargando, error, vacío) y las tarjetas -->
        <section id="contenedorEquipos" class="grid-equipos"></section>
    </main>

    <!-- Modal oculto para ver la información completa al clicar un equipo -->
    <div id="modalDetalle" class="modal oculto">
        <div class="modal-contenido">
            <button id="btnCerrarModal" class="btn-cerrar" type="button">✖ Cerrar</button>
            <div id="cuerpoModal"></div>
        </div>
    </div>
</body>
</html>
